<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Julia's Issue Tracker</title>
    <link rel="stylesheet" href="./styles.css?v=2026072901" />
  </head>
  <body>
    <main class="app-shell">
    <header class="hero app-header">
      <nav class="topbar" aria-label="Preview controls">
        <span class="brand-mark">J</span>
        <div class="top-actions">
          <span class="role-pill">Admin</span>
          <span id="sync-status" class="sync-dot is-synced">Synced</span>
          <button id="top-refresh-button" type="button" class="ghost-button">Refresh</button>
          <button id="new-issue-button" type="button" class="light-button">+ New Issue</button>
        </div>
      </nav>

      <section class="hero-copy" aria-labelledby="page-title">
        <p class="eyebrow">HAM User Issue Dashboard</p>
        <h1 id="page-title">Julia's Issue Tracker</h1>
        <p>Track user issues from feedback to engineering resolution.</p>
      </section>
    </header>

    <section class="workspace dashboard-view">
      <section class="workspace-section filter-section">
        <section class="filters filter-bar" aria-label="Issue filters">
          <div class="filter-search-row">
          <label class="search">
            <span>Keyword Search</span>
            <input id="keyword-search" placeholder="Search issue, user, reply..." />
          </label>
          <button id="refresh-button" type="button">Refresh</button>
          </div>
          <div class="filter-control-row">
          <label>
            <span>Year</span>
            <select id="year-filter">
              <option>All Years</option>
              <option>2026</option>
              <option>2025</option>
            </select>
          </label>
          <label>
            <span>Product Model</span>
            <select id="model-filter">
              <option>All Models</option>
              <option>HA2</option>
              <option>HA1UV</option>
              <option>HD1</option>
            </select>
          </label>
          <label>
            <span>Module</span>
            <select id="module-filter">
              <option>All Modules</option>
              <option>Firmware</option>
              <option>CPS</option>
              <option>Hardware</option>
            </select>
          </label>
          <label>
            <span>Severity</span>
            <select id="severity-filter">
              <option>All Severity</option>
              <option>High</option>
              <option>Medium</option>
              <option>Low</option>
            </select>
          </label>
          <fieldset class="date-range-filter">
            <legend>Date Range</legend>
            <label>
              <span>From Date</span>
              <input id="date-from-filter" type="date" />
            </label>
            <label>
              <span>To Date</span>
              <input id="date-to-filter" type="date" />
            </label>
          </fieldset>
          </div>
        </section>
      </section>

      <section class="workspace-section metrics-section">
        <section id="summary" class="kpis summary-strip" aria-label="Issue summary">
          <button class="kpi total summary-card is-active" type="button" data-summary="all" aria-pressed="true">
            <span>Total</span>
            <strong id="total-count">0</strong>
          </button>
          <button class="kpi submit summary-card" type="button" data-summary="submit" aria-pressed="false">
            <span>To Submit</span>
            <strong id="submit-count">0</strong>
            <em id="submit-percent">0.0%</em>
          </button>
          <button class="kpi submitted summary-card" type="button" data-summary="submitted" aria-pressed="false">
            <span>Submitted</span>
            <strong id="submitted-count">0</strong>
            <em id="submitted-percent">0.0%</em>
          </button>
          <button class="kpi progress summary-card" type="button" data-summary="progress" aria-pressed="false">
            <span>In Progress</span>
            <strong id="progress-count">0</strong>
            <em id="progress-percent">0.0%</em>
          </button>
          <button class="kpi resolved summary-card" type="button" data-summary="resolved" aria-pressed="false">
            <span>Resolved</span>
            <strong id="resolved-count">0</strong>
            <em id="resolved-percent">0.0%</em>
          </button>
          <button class="kpi archived summary-card" type="button" data-summary="archived" aria-pressed="false">
            <span>Archived</span>
            <strong id="archived-count">0</strong>
            <em id="archived-percent">0.0%</em>
          </button>
        </section>
      </section>

      <section class="workspace-section board-section">
        <div class="section-heading board-heading">
          <div>
            <p>Workboard</p>
          </div>
          <span id="showing-label">Showing 2025 + 2026</span>
        </div>
        <p id="board-message" class="board-message is-hidden">Loading Google Sheets data...</p>
        <section id="board" class="board status-board" aria-label="Issue progress board">
        <section class="lane lane-submit">
          <header><h2>To Submit</h2><span id="submit-lane-count">0</span></header>
          <div id="submit-cards" class="lane-cards"></div>
        </section>

        <section class="lane lane-submitted">
          <header><h2>Submitted</h2><span id="submitted-lane-count">0</span></header>
          <div id="submitted-cards" class="lane-cards"></div>
        </section>

        <section class="lane lane-progress">
          <header><h2>In Progress</h2><span id="progress-lane-count">0</span></header>
          <div id="progress-cards" class="lane-cards"></div>
        </section>

        <section class="lane lane-resolved">
          <header><h2>Resolved</h2><span id="resolved-lane-count">0</span></header>
          <div id="resolved-cards" class="lane-cards"></div>
        </section>

        <section class="lane lane-archived">
          <header><h2>Archived</h2><span id="archived-lane-count">0</span></header>
          <div id="archived-cards" class="lane-cards"></div>
        </section>
        </section>
      </section>
    </section>
    <aside id="detail-panel" class="detail-panel is-hidden" aria-label="Issue detail"></aside>
    <button id="detail-backdrop" class="detail-backdrop is-hidden" type="button" aria-label="Close detail"></button>
    </main>
    <script src="./app.js?v=2026072901"></script>
  </body>
</html>
